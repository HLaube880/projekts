<html>
  

<head>
  <meta charset="UTF-8" />
  <title>Aptauja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>


<h1>Aptaujas anketa</h1>
<form action="{{ url_for('iesniegt') }}" method="post">
  <label for="vards">Vārds</label>
  <input type="text" id="vards" name="vards" required>
  <br><br>
  <label>Dzimums</label><br>
  <input type="radio" id="virietis" name="dzimums" value="virietis" required>
  <label for="virietis">Vīrietis</label>
  <input type="radio" id="sieviete" name="dzimums" value="sieviete" required>
  <label for="sieviet">Sieviete</label>
  <input type="radio" id="cits" name="dzimums" value="cits" required>
  <label for="cits">Cits</label>
  <label>Hobiji</label><br>
  <input type="checkbox" id="hobijs1" name="hobiji" value="Lasīšana">
  <label for="hobijs1">Lasīšana</label>
  <input type="checkbox" id="hobijs2" name="hobiji" value="Ceļošana">
  <label for="hobijs2">Ceļošana</label>
  <input type="checkbox" id="hobijs3" name="hobiji" value="Ēdienu gatavošana">
  <label for="hobijs3">Ēdienu gatavošana</label>
  <input type="checkbox" id="hobijs4" name="hobiji" value="Sports">
  <label for="hobijs4">Sports</label>
  <input type="checkbox" id="hobijs5" name="hobiji" value="Mūzika">
  <label for="hobijs5">Mūzika</label><br>
  <button type="submit">Iesniegt</button>
</form>
  
  </html>
