<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrācijas panelis</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='stils.css') }}" />
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Administrācijas panelis</h1>
      <a href="{{ url_for('izlogoties') }}" class="btn btn-secondary">Izlogoties</a>
    </div>

    <h2 class="mb-3">Respondentu atbildes:</h2>

    {% if lietotaji %}
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Vārds</th>
          <th>Dzimums</th>
          <th>Hobiji</th>
          <th>Darbība</th>
        </tr>
      </thead>
      <tbody>
        {% for lietotajs in lietotaji %}
        <tr>
          <td>{{ lietotajs[0] }}</td>
          <td>{{ lietotajs[1] }}</td>
          <td>{{ lietotajs[2] }}</td>
          <td>{{ lietotajs[3] }}</td>
          <td>
            <a href="{{ url_for('dzest_lietotaju', id=lietotajs[0]) }}" class="btn btn-danger btn-sm">Dzēst</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <div class="alert alert-info">Nav neviena respondenta datu.</div>
    {% endif %}
  </div>
</body>
</html>
