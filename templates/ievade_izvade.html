{% extends "pamati_sintakse.html" %}

{% block content %}
<h1>Ievade un izvade</h1>
{% if vards %}
<p>Tu ievadīji {{ vards }}</p>
<a href="/ievade_izvade">Atgriezties</a>
{% else %}
<form method="POST">
  <input type="text" name="vards" placeholder="Ievadi vārdu!">
  <input type="submit" value="Iesniegt!">
</form>
{% endif %}
{% endblock %}
